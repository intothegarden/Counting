<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny One</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: transparent;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .display-card {
            background: #fff;
            border: 0.5px solid rgba(0, 0, 0, 0.12);
            border-radius: 12px;
            padding: 2rem 1.5rem 1.5rem;
            max-width: 700px;
            width: 100%;
            text-align: center;
        }

        .event-label {
            font-size: 13px;
            color: #888;
            margin-bottom: 0.5rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .total-p {
            font-size: 60px;
            font-weight: 500;
            line-height: 1;
            letter-spacing: -2px;
        }

        .since-p {
            font-size: 13px;
            color: #666;
            padding-top: 1rem;
            border-top: 0.5px solid rgba(0, 0, 0, 0.1);
            line-height: 1.7;
            white-space: pre-line;
        }

        .updated-p {
            font-size: 11px;
            color: #bbb;
            margin-top: 0.75rem;
        }

        .fruit-card {
            text-align: center;
        }

        .fruit-img {
            margin-top: 40px;
        }

        .fruit-img {
            width: 120px;
            margin-top: 40px;
        }

        .fruit-card {
            padding-top: 40px;
        }

        .fact-heading {
            font-size: 32px;
        }

        @media (prefers-color-scheme: dark) {
            body {
                color: #e8e8e8;
            }

            .display-card {
                background: #1e1e1e;
                border-color: rgba(255, 255, 255, 0.1);
            }

            .week-big {
                color: #e8e8e8;
            }

            .detail {
                border-top-color: rgba(255, 255, 255, 0.1);
                color: #aaa;
            }
        }
    </style>
</head>
<body>
<div class="display-card">
    <p class="event-label">Tiny One</p>
    <p class="total-p" id="total-time"></p>
    <div class="since-p" id="since-date"></div>
    <p class="updated-p" id="updated-date"></p>
</div>

<div class="fruit-card">
    <img class="fruit-img" id="fruit-image" src="./assets/04_weeks_poppy_seed.png" alt="fruit-img">
</div>

<div class="fact-card">
    <p class="fact-heading">This week...</p>
    <p class="fact-label" id="fact-text">Tiny One</p>
</div>

<script>
    const START = new Date('2026-02-27T00:00:00');

    function tick() {
        const now = new Date();
        const ms = now - START;

        const totalDays = Math.floor(ms / 86400000);
        const weeks = Math.floor(totalDays / 7);
        const remDays = totalDays % 7;

        document.getElementById('total-time').textContent = weeks + ' Weeks and ' + remDays + ' days';
        document.getElementById('since-date').textContent = `Since ${START.toLocaleDateString(undefined, {
            day: 'numeric',
            month: 'long',
            year: 'numeric'
        })}`;
        document.getElementById('updated-date').textContent = 'Updated ' + now.toLocaleTimeString();
        document.getElementById('fruit-image').src = './assets/' + getImageForWeek(weeks);
        document.getElementById('fact-text').textContent = getFactForWeek(weeks);
    }

    function getImageForWeek(weeks) {
        switch (weeks) {
            case 4:
                return '04_weeks_poppy_seed.png';
            case 5:
                return '05_weeks_sesame_seed.png';
            case 6:
                return '06_weeks_lentil_seed.png';
            case 7:
                return '07_weeks_blueberry.png';
            case 8:
                return '08_weeks_raspberry.png';
            case 9:
                return '09_weeks_grape.png';
            case 10:
                return '10_weeks_date.png';
            case 11:
                return '11_weeks_lime.png';
            case 12:
                return '12_weeks_plum.png';
            case 13:
                return '13_weeks_kiwi_fruit.png';
            case 14:
                return '14_weeks_peach.png';
            case 15:
                return '15_weeks_pear.png';
            case 16:
                return '16_weeks_avocado.png';
            case 17:
                return '17_weeks_naval_orange.png';
            case 18:
                return '18_weeks_pomegranate.png';
            case 19:
                return '19_weeks_grapefruit.png';
            case 20:
                return '20_weeks_mango.png';
            case 21:
                return '21_weeks_rockmelon.png';
            case 22:
            case 23:
            case 24:
                return '22_24_weeks_eggplant.png';
            case 25:
            case 26:
            case 27:
            case 28:
                return '25_28_weeks_papaya.png';
            case 29:
            case 30:
            case 31:
            case 32:
                return '29_32_weeks_pumpkin.png';
            case 33:
            case 34:
            case 35:
            case 36:
                return '33_36_weeks_honeydew.png';
            case 37:
            case 38:
            case 39:
            case 40:
                return '37_40_weeks_watermelon.png';
            default:
                return '04_weeks_poppy_seed.png';
        }
    }

    function getFactForWeek(weeks) {
        switch (weeks) {
            case 6:
                return 'Heart beating and neural tube is closing';
            case 8:
                return 'test';
        }
    }

    tick();
</script>
</body>
</html>
