<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny One</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: transparent;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .display-card {
            background: #fff;
            border: 0.5px solid rgba(0, 0, 0, 0.12);
            border-radius: 12px;
            padding: 2rem 1.5rem 1.5rem;
            max-width: 700px;
            width: 100%;
            text-align: center;
        }

        .event-label {
            font-size: 13px;
            color: #888;
            margin-bottom: 0.5rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .total-p {
            font-size: 60px;
            font-weight: 500;
            line-height: 1;
            letter-spacing: -2px;
        }

        .since-p {
            font-size: 13px;
            color: #666;
            padding-top: 1rem;
            border-top: 0.5px solid rgba(0, 0, 0, 0.1);
            line-height: 1.7;
            white-space: pre-line;
        }

        .updated-p {
            font-size: 11px;
            color: #bbb;
            margin-top: 0.75rem;
        }

        .fruit-card {
            text-align: center;
        }

        .fruit-img {
            margin-top: 40px;
        }

        .fruit-img {
            width: 120px;
            margin-top: 40px;
        }

        .fruit-card {
            padding-top: 40px;
        }

        .fact-heading {
            font-size: 32px;
        }

        @media (prefers-color-scheme: dark) {
            body {
                color: #e8e8e8;
            }

            .display-card {
                background: #1e1e1e;
                border-color: rgba(255, 255, 255, 0.1);
            }

            .week-big {
                color: #e8e8e8;
            }

            .detail {
                border-top-color: rgba(255, 255, 255, 0.1);
                color: #aaa;
            }
        }
    </style>
</head>
<body>
<div class="display-card">
    <p class="event-label">Tiny One</p>
    <p class="total-p" id="total-time"></p>
    <div class="since-p" id="since-date"></div>
    <p class="updated-p" id="updated-date"></p>
</div>

<div class="fruit-card">
    <img class="fruit-img" id="fruit-image" src="./assets/04_weeks_poppy_seed.png" alt="fruit-img">
</div>

<div class="fact-card">
    <p class="fact-heading">This week...</p>
    <p class="fact-label" id="fact-text">Tiny One</p>
</div>

<script>
    const START = new Date('2026-02-27T00:00:00');

    function tick() {
        const now = new Date();
        const ms = now - START;

        const totalDays = Math.floor(ms / 86400000);
        const weeks = Math.floor(totalDays / 7);
        const remDays = totalDays % 7;

        document.getElementById('total-time').textContent = weeks + ' Weeks and ' + remDays + ' days';
        document.getElementById('since-date').textContent = `Since ${START.toLocaleDateString(undefined, {
            day: 'numeric',
            month: 'long',
            year: 'numeric'
        })}`;
        document.getElementById('updated-date').textContent = 'Updated ' + now.toLocaleTimeString();
        document.getElementById('fruit-image').src = './assets/' + getImageForWeek(weeks);
        document.getElementById('fact-text').textContent = getFactForWeek(weeks);
    }

    function getImageForWeek(weeks) {
        switch (weeks) {
            case 4:
                return '04_weeks_poppy_seed.png';
            case 5:
                return '05_weeks_sesame_seed.png';
            case 6:
                return '06_weeks_lentil_seed.png';
            case 7:
                return '07_weeks_blueberry.png';
            case 8:
                return '08_weeks_raspberry.png';
            case 9:
                return '09_weeks_grape.png';
            case 10:
                return '10_weeks_date.png';
            case 11:
                return '11_weeks_lime.png';
            case 12:
                return '12_weeks_plum.png';
            case 13:
                return '13_weeks_kiwi_fruit.png';
            case 14:
                return '14_weeks_peach.png';
            case 15:
                return '15_weeks_pear.png';
            case 16:
                return '16_weeks_avocado.png';
            case 17:
                return '17_weeks_naval_orange.png';
            case 18:
                return '18_weeks_pomegranate.png';
            case 19:
                return '19_weeks_grapefruit.png';
            case 20:
                return '20_weeks_mango.png';
            case 21:
                return '21_weeks_rockmelon.png';
            case 22:
            case 23:
            case 24:
                return '22_24_weeks_eggplant.png';
            case 25:
            case 26:
            case 27:
            case 28:
                return '25_28_weeks_papaya.png';
            case 29:
            case 30:
            case 31:
            case 32:
                return '29_32_weeks_pumpkin.png';
            case 33:
            case 34:
            case 35:
            case 36:
                return '33_36_weeks_honeydew.png';
            case 37:
            case 38:
            case 39:
            case 40:
                return '37_40_weeks_watermelon.png';
            default:
                return '04_weeks_poppy_seed.png';
        }
    }

    function getFactForWeek(weeks) {
        switch (weeks) {
            case 4:
                return 'The tiny embryo is settling in, and the early placenta and amniotic sac are starting to form.';
            case 5:
                return 'The neural tube, which becomes the brain and spinal cord, is developing quickly this week.';
            case 6:
                return 'A tiny heartbeat may be detectable, and little arm and leg buds are beginning to appear.';
            case 7:
                return 'The brain is growing rapidly, and the face, eyes, and limb shapes are becoming more defined.';
            case 8:
                return 'Tiny fingers and toes are starting to form, and all major organ systems have begun developing.';
            case 9:
                return 'Facial features are becoming clearer, and tiny muscles are starting to make small movements.';
            case 10:
                return 'This is often when the embryo is called a fetus, and tiny nails and tooth buds are beginning to develop.';
            case 11:
                return 'Bones are starting to harden, and tiny movements are happening even if they cannot be felt yet.';
            case 12:
                return 'Reflexes are developing, and the kidneys are beginning to make urine.';
            case 13:
                return 'The body is starting to catch up with the head, and vocal cords are beginning to develop.';
            case 14:
                return 'Facial expressions can begin, and fine details like eyebrows and body hair are starting to form.';
            case 15:
                return 'The skeleton is becoming stronger, and taste buds are continuing to develop.';
            case 16:
                return 'The eyes can begin to sense light, and movements are getting more coordinated.';
            case 17:
                return 'Fat stores are beginning to build, helping with warmth and energy later on.';
            case 18:
                return 'The ears are developing well enough that sounds from outside may start to be noticed.';
            case 19:
                return 'A protective coating called vernix is forming on the skin.';
            case 20:
                return 'This is around the halfway point, and movements may be easier to feel.';
            case 21:
                return 'Swallowing practice continues, and the digestive system is becoming more active.';
            case 22:
                return 'The senses are sharpening, and tiny sleep and wake patterns may be starting.';
            case 23:
                return 'The lungs are practicing breathing movements, even though oxygen still comes through the placenta.';
            case 24:
                return 'The inner ear is developing balance, so movement and position are becoming more noticeable.';
            case 25:
                return 'Hair is growing, and the startle response can become stronger.';
            case 26:
                return 'The eyes may begin to open, and the brain is becoming more responsive to sound and light.';
            case 27:
                return 'The lungs and brain are continuing major growth, and regular sleep cycles are becoming clearer.';
            case 28:
                return 'The third trimester begins around now, and blinking and dreaming-like sleep activity can happen.';
            case 29:
                return 'Muscles and lungs are maturing, and kicks can feel stronger as coordination improves.';
            case 30:
                return 'The brain is developing new folds and grooves, creating more surface area for future learning.';
            case 31:
                return 'The senses keep improving, and the body is gaining fat to help regulate temperature after birth.';
            case 32:
                return 'Many babies start settling head-down around this stage, though position can still change.';
            case 33:
                return 'The immune system is developing, helped by antibodies passed through the placenta.';
            case 34:
                return 'The lungs are getting closer to maturity, and the body keeps adding soft layers of fat.';
            case 35:
                return 'Space is getting tighter, so movements may feel more like rolls and stretches than sharp kicks.';
            case 36:
                return 'The body is nearly ready for birth, and growth is now focused on steady weight gain.';
            case 37:
                return 'This is considered early term, and the lungs and brain are still adding finishing touches.';
            case 38:
                return 'Tiny fingernails may reach the fingertips, and the body is continuing to prepare for life outside.';
            case 39:
                return 'The brain is still growing quickly, and the baby is building energy stores for birth.';
            case 40:
                return 'The due-date week has arrived, though it is common for babies to come a little before or after.';
            default:
                return 'Tiny one is growing and changing every day.';
        }
    }

    tick();
</script>
</body>
</html>
